[project]
name = "mailops-agent-backend"
version = "0.1.0"
description = "Backend services for MailOps Agent"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4",
  "cryptography>=43.0.3",
  "fastapi>=0.115.0",
  "google-api-python-client>=2.151.0",
  "google-auth-oauthlib>=1.2.1",
  "langchain-openai>=0.2.14",
  "langgraph>=0.2.59",
  "langgraph-checkpoint-sqlite>=2.0.1",
  "pydantic-settings>=2.6.1",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.32.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
